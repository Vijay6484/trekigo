services:
  mysql:
    image: mysql:8.0
    container_name: trekigo-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: trekigo
      MYSQL_DATABASE: trekigo
      MYSQL_USER: trekigo
      MYSQL_PASSWORD: trekigo
    volumes:
      - trekigo-mysql:/var/lib/mysql
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  trekigo-mysql:
